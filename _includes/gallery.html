<!DOCTYPE html>

<html lang="en">
<head>
<title>{{ title }}</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="/style/w3v5.02.css">
<link rel="stylesheet" href="/style/main.css">

<link rel="icon" href="/images/icon-192x192.jpg" sizes="192x192">
<link rel="icon" href="/images/icon-32x32.jpg" sizes="32x32">
<link rel="apple-touch-icon" href="/images/icon-180x180.jpg">

<!-- Facebook Meta Tags -->
<meta property="og:url" content="https://www.hyam.net/blog{{page.url}}">
<meta property="og:type" content="website">
<meta property="og:title" content="Roger Hyam: {{ title }}">
<meta property="og:description" content="{{ date | date: '%A %d %B %Y', 'UCT' }} - {{ title }} - Roger Hyam">
<meta property="og:image" content="{{ thumbnail | default: "https://www.hyam.net/images/banner.jpg" }}">

<!-- Twitter Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://www.hyam.net/">
<meta name="twitter:title" content="Roger Hyam: {{ title }}">
<meta name="twitter:description" content="{{ date | date: '%A %d %B %Y', 'UCT' }} - {{ title }} - Roger Hyam">
<meta name="twitter:image" content="{{ thumbnail | default: "https://www.hyam.net/images/banner.jpg" }}">

</head>
<body>

<!-- Navbar (sit on top) -->
<div class="w3-top">
  <div class="w3-bar w3-white" id="myNavbar">
    <a class="w3-bar-item w3-button w3-hover-black w3-hide-medium w3-hide-large w3-right" href="javascript:void(0);" onclick="toggleFunction()" title="Toggle Navigation Menu">
      <i class="fa fa-bars"></i>
    </a>
    <a href="/" class="w3-bar-item w3-button">HOME</a>
    <a href="/#about" class="w3-bar-item w3-button w3-hide-small"><i class="fa fa-user"></i> ABOUT</a>
    <a href="/#photographs" class="w3-bar-item w3-button w3-hide-small"><i class="fa fa-th"></i> PHOTOGRAPHS</a>
    <a href="/#dedication" class="w3-bar-item w3-button w3-hide-small"><i class="fa fa-heart-o"></i> DEDICATION</a>
    <a href="/#contact" class="w3-bar-item w3-button w3-hide-small"><i class="fa fa-envelope"></i> CONTACT</a>
  </div>

  <!-- Navbar on small screens -->
  <div id="navDemo" class="w3-bar-block w3-white w3-hide w3-hide-large w3-hide-medium">
    <a href="/#about" class="w3-bar-item w3-button" onclick="toggleFunction()">ABOUT</a>
    <a href="/#photographs" class="w3-bar-item w3-button" onclick="toggleFunction()">PHOTOGRAPHS</a>
    <a href="/#dedication" class="w3-bar-item w3-button" onclick="toggleFunction()">DEDICATION</a>
    <a href="/#contact" class="w3-bar-item w3-button" onclick="toggleFunction()">CONTACT</a>
  </div>
</div>

{{ content }}


<!-- Footer -->
<footer class="w3-center w3-black w3-padding-64 w3-opacity w3-hover-opacity-off">
  <a href="#home" class="w3-button w3-light-grey"><i class="fa fa-arrow-up w3-margin-right"></i>To the top</a>
  <p>Template from <a href="https://www.w3schools.com/w3css/default.asp" title="W3.CSS" target="_blank" class="w3-hover-text-green">w3.css</a></p>
</footer>
 
<script>

// close a modal dialogue on background click.
window.onclick = function(event) {
    if (event.target.classList.contains('w3-modal')){
        event.target.style.display='none'
    }
}


// Used to toggle the menu on small screens when clicking on the menu button
function toggleFunction() {
    var x = document.getElementById("navDemo");
    if (x.className.indexOf("w3-show") == -1) {
        x.className += " w3-show";
    } else {
        x.className = x.className.replace(" w3-show", "");
    }
}
</script>

</body>
</html>
